const F=[...document.querySelectorAll("iframe")],T=[...document.querySelectorAll(".tab")];
addEventListener("message",e=>{const f=F.find(x=>x.contentWindow===e.source);if(f&&e.data&&e.data.conj05h>50)f.style.height=e.data.conj05h+"px"});
